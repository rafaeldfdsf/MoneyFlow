<div>
    @if (label) {
        <label class="block font-bold mb-3">
          {{ label }}
        </label>
    }

    <p-select
    [options]="options()"
    optionLabel="label"
    optionValue="value"
    [(ngModel)]="value"
    (ngModelChange)="valueChange.emit($event)"
    [loading]="loading()"
    fluid>
    </p-select>
</div>
